<script>
document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.texto_menu').forEach(function (el) {
        const text = el.textContent.trim();
        if (!text) return;
        el.textContent = '';
        // separar por carácter; para separar por palabra usa text.split(' ')
        text.split('').forEach(function (ch) {
            const span = document.createElement('span');
            span.textContent = ch;
            el.appendChild(span);
        });
    });
});
</script>
