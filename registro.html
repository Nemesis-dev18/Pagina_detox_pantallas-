<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/styles.css">
	<title>Crear cuenta | DETOX_WEB</title>
</head>
<body class="inicio_sesion">
	<header class="cabecera">
		<div class="hero">
			<div class="hero-left" id="logo">
				<img src="img/cirno-cirno-fumo.gif" alt="Logo DETOX_WEB">
			</div>
			<div class="hero-center">
				<h1>DETOX_WEB</h1>
			</div>
		</div>
	</header>

	<section class="texto_sesion">
		<div class="registro-cuenta">
			<h2 class="titulo">Crear cuenta</h2>
			<form class="formulario-cuenta" action="procesar_registro.php" method="POST">
				<label for="nombre">Nombre</label>
				<input type="text" id="nombre" name="nombre" placeholder="NOMBRE" required>

				<label for="correo">Correo electrónico</label>
				<input type="email" id="correo" name="correo" placeholder="CORREO ELECTRÓNICO" required>

				<label for="password">Contraseña</label>
				<input type="password" id="password" name="password" placeholder="CONTRASEÑA" required>

				<label for="confirmar-password">Confirmar contraseña</label>
				<input type="password" id="confirmar-password" name="confirmar_password" placeholder="CONFIRMAR CONTRASEÑA" required>

				<button class="boton-cuenta" type="submit">Crear cuenta</button>
			</form>
			<p class="enlace-cuenta">¿Ya tienes una cuenta? <a href="inicio_sesion.html">Inicia sesión</a></p>
		</div>

	</section>

	<footer>
		<p class="pies">&copy; 2024 DETOX_WEB. Todos los derechos reservados.</p>
	</footer>
</body>
</html>
