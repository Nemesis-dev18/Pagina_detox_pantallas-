<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Comunidad | DETOX_WEB</title>
    <style>
        [hidden] { display: none !important; }
        .foro { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        .foro input, .foro textarea, .foro select { width: 100%; box-sizing: border-box; margin: .3rem 0 1rem; padding: .6rem; font: inherit; }
        .foro button { padding: .6rem 1.2rem; font: inherit; cursor: pointer; }
        .publicacion { border: 1px solid currentColor; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
        .publicacion .meta { opacity: .7; font-size: .9rem; }
        .publicacion .cuerpo { white-space: pre-wrap; }
        .respuestas { margin-top: 1rem; padding-left: 1rem; border-left: 3px solid currentColor; }
        .comentario { margin: .8rem 0; }
    </style>
</head>
<body class="comunidad">
    <header class="cabecera">
        <div class="hero">
            <div class="hero-left" id="logo">
                <img src="img/cirno-cirno-fumo.gif" alt="Logo DETOX_WEB">
            </div>
            <div class="hero-center">
                <h1>DETOX_WEB</h1>
            </div>
        </div>
    </header>

    <main class="foro">
        <h2>Comunidad</h2>

        <p id="pide-login">Para publicar necesitas <a href="inicio_sesion.html">iniciar sesión</a>.</p>

        <form id="form-publicar" hidden>
            <p>Publicas como <strong id="mi-alias"></strong></p>

            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" maxlength="120" required>

            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" required>
                <option value="experiencia">Experiencia</option>
                <option value="pregunta">Pregunta</option>
                <option value="consejo">Consejo</option>
            </select>

            <label for="contenido">Cuéntanos</label>
            <textarea id="contenido" name="contenido" rows="5" maxlength="5000" required></textarea>

            <button type="submit">Publicar</button>
            <p id="mensaje"></p>
        </form>

        <section id="lista"></section>
    </main>
<script>
    const lista = document.getElementById('lista');
    const formulario = document.getElementById('form-publicar');
    const pideLogin = document.getElementById('pide-login');
    const miAlias = document.getElementById('mi-alias');
    const mensaje = document.getElementById('mensaje');
    let haySesion = false;

    async function comprobarSesion() {
        const res = await fetch('/yo');
        if (res.ok) {
            const datos = await res.json();
            miAlias.textContent = datos.alias;
            pideLogin.hidden = true;
            formulario.hidden = false;
            haySesion = true;
        }
    }

    function crearElemento(etiqueta, clase, texto) {
        const el = document.createElement(etiqueta);
        if (clase) el.className = clase;
        if (texto !== undefined) el.textContent = texto;
        return el;
    }

    function formatearFecha(iso) {
        return new Date(iso).toLocaleString('es-CO');
    }

    async function cargarComentarios(publicacionId, contenedor) {
        const res = await fetch('/publicaciones/' + publicacionId + '/comentarios');
        const comentarios = await res.json();

        contenedor.replaceChildren();
        if (comentarios.length === 0) {
            contenedor.append(crearElemento('p', 'meta', 'Aún no hay respuestas.'));
            return;
        }
        for (const c of comentarios) {
            const item = crearElemento('div', 'comentario');
            item.append(
                crearElemento('p', 'meta', c.alias + ' · ' + formatearFecha(c.creado_en)),
                crearElemento('p', 'cuerpo', c.contenido)
            );
            contenedor.append(item);
        }
    }

    function crearBloqueRespuestas(publicacionId) {
        const bloque = crearElemento('div', 'respuestas');
        bloque.hidden = true;

        const listaComentarios = crearElemento('div');
        bloque.append(listaComentarios);

        if (haySesion) {
            const form = document.createElement('form');
            const caja = document.createElement('textarea');
            caja.name = 'contenido';
            caja.rows = 3;
            caja.maxLength = 2000;
            caja.required = true;
            caja.placeholder = 'Escribe tu respuesta...';
            const boton = crearElemento('button', '', 'Responder');
            boton.type = 'submit';
            const aviso = crearElemento('p', 'meta');
            form.append(caja, boton, aviso);

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const res = await fetch('/publicaciones/' + publicacionId + '/comentarios', {
                    method: 'POST',
                    body: new URLSearchParams(new FormData(form))
                });
                if (res.ok) {
                    form.reset();
                    aviso.textContent = '';
                    cargarComentarios(publicacionId, listaComentarios);
                } else {
                    aviso.textContent = await res.text();
                }
            });
            bloque.append(form);
        } else {
            bloque.append(crearElemento('p', 'meta', 'Inicia sesión para responder.'));
        }
        return bloque;
    }

    async function cargarPublicaciones() {
        const res = await fetch('/publicaciones');
        const publicaciones = await res.json();

        lista.replaceChildren();
        if (publicaciones.length === 0) {
            lista.textContent = 'Aún no hay publicaciones. ¡Sé la primera persona!';
            return;
        }

        for (const p of publicaciones) {
            const art = crearElemento('article', 'publicacion');
            const bloque = crearBloqueRespuestas(p.id);
            const listaComentarios = bloque.firstChild;

            const boton = crearElemento('button', '', 'Ver respuestas');
            boton.addEventListener('click', () => {
                bloque.hidden = !bloque.hidden;
                if (!bloque.hidden) {
                    cargarComentarios(p.id, listaComentarios);
                }
                boton.textContent = bloque.hidden ? 'Ver respuestas' : 'Ocultar respuestas';
            });

            art.append(
                crearElemento('h3', '', p.titulo),
                crearElemento('p', 'meta', p.alias + ' · ' + p.categoria + ' · ' + formatearFecha(p.creado_en)),
                crearElemento('p', 'cuerpo', p.contenido),
                boton,
                bloque
            );
            lista.append(art);
        }
    }

    formulario.addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/publicaciones', {
            method: 'POST',
            body: new URLSearchParams(new FormData(formulario))
        });
        if (res.ok) {
            formulario.reset();
            mensaje.textContent = '';
            cargarPublicaciones();
        } else {
            mensaje.textContent = await res.text();
        }
    });

    // Primero sabemos si hay sesión, después dibujamos las publicaciones
    (async () => {
        await comprobarSesion();
        cargarPublicaciones();
    })();
</script>
</body>
</html>
